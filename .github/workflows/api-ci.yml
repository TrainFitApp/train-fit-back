name: API CI

# Verificación de la rama de PRO. NO despliega:
#
#   develop -> PRE: Render despliega solo con cada push (auto-deploy).
#   main    -> PRO: PM2 en el servidor, a mano (ver README de esta carpeta).
#
# Sin secretos y sin base de datos: los tests que necesitan Mongo
# (trainer-payments-db, stripe-local) se marcan como omitidos si no hay uno
# local, así que nunca se tocan las bases de PRE ni de PRO.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: api-ci-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: `npm test` le pasa globs a `node --test`, que Node 20 no
      # entiende ("Could not find components/**/*.test.js").
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --fund=false

      - name: Lint
        run: npm run lint

      # `pretest` ya compila el TypeScript, pero así un fallo de compilación
      # sale con su propio nombre y no escondido dentro de los tests.
      - name: Build TypeScript (trainerBilling + trainerPayments)
        run: npm run build:ts

      - name: Tests
        run: npm test
