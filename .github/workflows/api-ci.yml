name: API CI

# Verificación de la rama de PRO. NO despliega:
#
#   develop -> PRE: Render despliega solo con cada push (auto-deploy).
#   main    -> PRO: PM2 en el servidor, a mano (ver README de esta carpeta).
#
# Sin secretos y sin base de datos real: los tests que necesitan Mongo
# (integration/, trainer-payments-db) arrancan un mongod efímero con
# mongodb-memory-server (el binario se cachea entre ejecuciones), así que
# nunca se tocan las bases de PRE ni de PRO.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: api-ci-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: `npm test` le pasa globs a `node --test`, que Node 20 no
      # entiende ("Could not find components/**/*.test.js").
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --fund=false

      # Binario de mongod para los tests de integración (mongodb-memory-server):
      # unos 100 MB que no hace falta bajar en cada ejecución.
      - name: Cache mongod (tests de integración)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Lint
        run: npm run lint

      # `pretest` ya compila el TypeScript, pero así un fallo de compilación
      # sale con su propio nombre y no escondido dentro de los tests.
      - name: Build TypeScript (trainerBilling + trainerPayments)
        run: npm run build:ts

      - name: Tests
        run: npm test
        env:
          MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
